[package]
name = "trustpath-lab"
version = "0.1.0"
edition = "2021"
description = "签名信任路径实验台 (Signature Trust Path Lab)"

[[bin]]
name = "trustpath-lab"
path = "src/main.rs"

[lib]
name = "trustpath_lab"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
pbkdf2 = { version = "0.12", features = ["simple"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }

[[test]]
name = "crash_runner"
harness = false
